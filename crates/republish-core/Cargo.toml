[package]
name = "republish-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol-agnostic republisher: MQTT/TLS publishing, worker orchestration, and an optional capability-driven iced GUI (feature `gui`)."

[features]
default = ["gui"]
# The iced desktop GUI (`app`/`ui` modules and `run`). Disable for headless
# consumers (web/daemon builds) to drop the whole windowing dependency tree.
gui = ["dep:iced", "dep:chrono"]

[dependencies]
proto-api = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, optional = true }
crossbeam-channel = { workspace = true }
directories = "6.0"
get_if_addrs = "0.5"
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1", features = ["v4"] }

rumqttc = "0.25.1"
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
sha2 = "0.10"

iced = { version = "0.14", features = ["fira-sans", "image", "tokio", "svg"], optional = true }

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"

[lints.rust]
# `coverage_nightly` is set by `cargo +nightly llvm-cov`; declare it so the
# `unexpected_cfgs` lint stays quiet under `-D warnings` on stable builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

