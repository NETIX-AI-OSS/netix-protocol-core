name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install Linux build dependencies (iced GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test cores
        run: cargo test --locked -p proto-api -p sim-core -p republish-core

  headless:
    name: Headless republish-core (no gui feature)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      # Deliberately NO iced/windowing apt packages: headless consumers (the
      # containerized web republisher) build without them.
      - name: Assert iced is absent from the headless graph
        run: |
          if cargo tree -p republish-core --no-default-features -e normal | grep -q '^.*\biced\b'; then
            echo "iced leaked into the headless dependency graph" >&2
            exit 1
          fi
      - name: Clippy (headless)
        run: cargo clippy --locked -p republish-core --no-default-features --all-targets -- -D warnings
      - name: Test (headless)
        run: cargo test --locked -p republish-core --no-default-features
      - name: Adapters build headless
        run: |
          cargo check --locked -p proto-bacnet --features republish
          cargo check --locked -p proto-modbus --features republish
          cargo check --locked -p proto-opcua --features republish

  feature-matrix:
    name: Adapter feature permutations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: proto-bacnet, features: "" }
          - { package: proto-bacnet, features: "sim" }
          - { package: proto-bacnet, features: "republish" }
          - { package: proto-bacnet, features: "sim,republish" }
          - { package: proto-modbus, features: "" }
          - { package: proto-modbus, features: "sim" }
          - { package: proto-modbus, features: "republish" }
          - { package: proto-modbus, features: "sim,republish" }
          - { package: proto-opcua, features: "" }
          - { package: proto-opcua, features: "sim" }
          - { package: proto-opcua, features: "republish" }
          - { package: proto-opcua, features: "sim,republish" }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install Linux build dependencies (iced GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libegl1-mesa-dev
      - name: Test
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --locked -p ${{ matrix.package }} --features "${{ matrix.features }}"
          else
            cargo test --locked -p ${{ matrix.package }}
          fi

  all-features:
    name: Workspace all-features
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install Linux build dependencies (iced GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libegl1-mesa-dev
      - name: Test all features
        run: cargo test --locked --workspace --all-features

  loopback-smoke:
    name: Cross-protocol republish loopbacks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install Linux build dependencies (iced GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libegl1-mesa-dev
      - name: Run sim↔republish loopback tests
        run: |
          cargo test --locked -p proto-bacnet --features sim,republish --test republish_loopback
          cargo test --locked -p proto-modbus --features sim,republish --test republish_loopback
          cargo test --locked -p proto-opcua --features sim,republish --test republish_loopback
          cargo test --locked -p proto-opcua --features sim,republish --test secured_loopback

  cargo-deny:
    name: License and advisory gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses and advisories
        run: cargo deny check

  fuzz-compile:
    name: Fuzz target compile check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Compile BACnet decoder fuzz target
        run: cargo build --manifest-path crates/proto-bacnet/fuzz/Cargo.toml --bin decode_scalar_value

  coverage:
    name: LLVM coverage (republish-core 100% line gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Nightly so `cargo llvm-cov` sets cfg(coverage_nightly), activating the
      # `#[coverage(off)]` markers that exclude test modules and the handful of
      # genuinely-unreachable OS-fault glue paths (config dir resolution, native
      # cert store, tokio runtime build failure, the live rumqttc event-loop
      # task). The attribute is inert on stable, so the `check` job is unaffected.
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Enforced: republish-core must keep 100% line coverage (0 uncovered
      # source lines) on the headless build. Fails the job on any regression.
      - name: Enforce 100% line coverage (republish-core, headless)
        # rust-toolchain.toml pins stable, so invoke nightly explicitly (`+nightly`
        # overrides the toolchain file). On real nightly, cargo-llvm-cov auto-sets
        # cfg(coverage_nightly), which activates the #[coverage(off)] markers that
        # exclude test modules and the unreachable OS-fault glue. (Do NOT force the
        # cfg via RUSTFLAGS: on stable it would trip #![feature] gates in deps.)
        run: cargo +nightly llvm-cov -p republish-core --no-default-features --fail-uncovered-lines 0
      - name: Install Linux build dependencies (iced GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libegl1-mesa-dev
      - name: Workspace coverage report (informational)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --ignore-run-fail
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-report
          path: lcov.info
          if-no-files-found: error
